name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: portkeytest
          POSTGRES_DB: portkey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portkey_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

      - name: Apply PostgreSQL migrations
        env:
          PGPASSWORD: portkeytest
        run: |
          for migration in migrations/postgres/*.sql; do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d portkey_test -f "$migration"
          done
      - name: Test PostgreSQL integration
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '5432'
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: portkeytest
          TEST_DB_NAME: portkey_test
        run: go test -tags=integration ./tests/integration -count=1

      - name: Prepare isolated Dashboard database
        env:
          PGPASSWORD: portkeytest
        run: |
          createdb -h 127.0.0.1 -U postgres portkey_e2e
          for migration in migrations/postgres/*.sql; do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d portkey_e2e -f "$migration"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - name: Test Dashboard and traffic policy flows
        env:
          PORTKEY_E2E_CONFIG: configs/config.ci.yaml
        run: bash dashboard/e2e/run-tests.sh e2e/milestone9.spec.ts e2e/milestone12.spec.ts e2e/milestone13.spec.ts e2e/milestone16.spec.ts
